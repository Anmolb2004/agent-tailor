[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tailor"
version = "0.1.0"
description = "Generate agent-ready Python CLIs from Kotlin Spring controllers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "jinja2>=3.1.4",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1"
]

[project.scripts]
agent-tailor = "agent_tailor.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_tailor*"]

[tool.setuptools.package-data]
"agent_tailor.generation.templates" = ["*.j2"]
